<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PollyGlot - Perfect Translation Every Time</title>
    <link rel="stylesheet" href="index.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Header -->
    <header class="app-header">
      <div class="app-header-inner">
        <img
          src="assets/parrot.png"
          alt="PollyGlot Parrot"
          class="logo-icon"
          onerror="this.style.display = 'none'"
        />
        <div>
          <h1>PollyGlot</h1>
          <p class="tagline">Perfect Translation Every Time</p>
        </div>
      </div>
    </header>

    <div class="app-container">
      <!-- Card -->
      <main class="card">
        <!-- INPUT VIEW -->
        <section id="inputView" class="view active-view">
          <label class="section-label">Text to translate 👇</label>
          <textarea
            id="sourceText"
            placeholder="Type your text here..."
          ></textarea>

          <label class="section-label">Select language 👇</label>
          <div class="radio-group">
            <label class="radio-option">
              <input type="radio" name="language" value="French" checked />
              <span class="radio-custom"></span>
              <span class="lang-label">French</span>
              <span class="flag"
                ><img src="assets/fr-flag.png" alt="french"
              /></span>
            </label>
            <label class="radio-option">
              <input type="radio" name="language" value="Spanish" />
              <span class="radio-custom"></span>
              <span class="lang-label">Spanish</span>
              <span class="flag"
                ><img src="assets/sp-flag.png" alt="spanish"
              /></span>
            </label>
            <label class="radio-option">
              <input type="radio" name="language" value="Japanese" />
              <span class="radio-custom"></span>
              <span class="lang-label">Japanese</span>
              <span class="flag"
                ><img src="assets/jpn-flag.png" alt="japanese"
              /></span>
            </label>
          </div>

          <div id="errorMsg" class="error-msg" style="display: none"></div>

          <button id="translateBtn" class="btn-primary">
            <span class="btn-text">Translate</span>
            <span class="spinner" style="display: none"></span>
          </button>
        </section>

        <!-- RESULT VIEW -->
        <section id="resultView" class="view">
          <label class="section-label">Original text 👇</label>
          <div class="result-box" id="originalTextDisplay"></div>

          <label class="section-label">Your translation 👇</label>
          <div class="result-box" id="translatedTextDisplay"></div>

          <button id="startOverBtn" class="btn-primary">Start Over</button>
        </section>
      </main>
    </div>

    <script type="module" src="index.js"></script>
  </body>
</html>
